<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            justify-content: center;
            position:relative;
            border-color:1px solid black;
             
        }
        .ball{
            border-radius:50%;
            width:150px;
            height:100px;
            background:red;
            position:absolute;
          animation:spin 3s infinite;  
        }
        @keyframes spin{
            from{
            left: 0px;
        }to{
            left :400px;
        }
    }
    </style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
