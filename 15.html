<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Animated Login Form</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        background:linear-gradient(135deg, #4facfe, #00f2fe);
        padding:20px;
    }

    .login-container{
        background:#fff;
        padding:30px;
        width:100%;
        max-width:400px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        animation:fadeIn 1s ease;
    }

    .login-container h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    .input-group{
        margin-bottom:15px;
    }

    .input-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
        outline:none;
        transition:0.3s;
    }

    .input-group input:focus{
        border-color:#4facfe;
        box-shadow:0 0 8px rgba(79,172,254,0.4);
    }

    .login-btn{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:#4facfe;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:background 0.3s ease, transform 0.3s ease;
    }

    .login-btn:hover{
        background:#007bff;
        transform:translateY(-3px);
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(-30px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    /* Mobile Responsive */
    @media (max-width:480px){
        .login-container{
            padding:20px;
        }

        .login-container h2{
            font-size:24px;
        }

        .input-group input,
        .login-btn{
            font-size:14px;
            padding:10px;
        }
    }
</style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form>
        <div class="input-group">
            <input type="text" placeholder="Username" required>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>
</div>

</body>
</html>
