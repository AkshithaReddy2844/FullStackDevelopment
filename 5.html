<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
        background-color: green;
        transform:scale(1.1);
        }
        button{
            background-color: blue;
            color:white;
            cursor:pointer;
            font-size:20px;
            transition:all 0.5s ease;
        }   
   
    </style>
</head>
<body>
    <div class="button">
        <button type="SUBMIT">Submit</button>
    </div>
</body>
</html>
